syntax = "proto3";
package ipc;

import "google/protobuf/timestamp.proto";

message RepoSource {
  PointSource src = 1;
  // Changing this for an existing repo point (same VfsPoint.id, same src) in
  // SetVfs rotates the key inside the repository: the new password is added
  // and the old key is removed. The repo must be writable (can_write) for that.
  string password = 2;
}

message PointSource {
  string scheme = 1;
  map<string, string> config = 2;
  string root = 3;
}

message VfsPoint {
  string id = 1;
  string name = 2;
  uint64 max_bytes = 3;
  // For data points: only local/fs-backed points can ever be written to by a
  // user through the Vfs_* calls (remote schemes are read-only there, even
  // when can_write is true). For repo points: gates backup/forget jobs.
  // Backup and restore jobs themselves still work against remote backends.
  bool can_write = 4;
  oneof src {
    PointSource data = 5;
    RepoSource repo = 6;
  }
}

enum PointHealth {
  POINT_HEALTH_UNKNOWN = 0; // not loaded yet
  POINT_HEALTH_HEALTHY = 1;
  POINT_HEALTH_FAILED = 2;  // see `error`; the point is NOT mounted in the user's VFS
}

message VfsInfo {
  string user = 1;
  VfsPoint point = 2;
  uint64 used_bytes = 3;
  PointHealth health = 4;
  // Human-readable reason when health == FAILED (init/open/config/quota-scan error).
  string error = 5;
}

message VfsUser {
  string name = 1;
  repeated VfsPoint points = 2;
}

message FilePath {
  string user = 1;
  oneof path {
    string virtual = 2;
    IndexedPath indexed = 3;
  }
}

message IndexedPath {
  string point_id = 1;
  string point_path = 2;
}

enum Priority {
  Debug = 0;
  Info = 1;
  Warning = 2;
  Error = 3;
  Critical = 4;
}

message DataFilter {
  repeated string globs = 1;
  repeated string ignore_globs = 2;
  repeated string custom_ignore_files = 3;
  optional uint64 exclude_larger_than = 4;
}

message Summary {
  uint64 files_new = 1;
  uint64 files_changed = 2;
  uint64 files_unmodified = 3;
  uint64 total_files_processed = 4;
  uint64 total_bytes_processed = 5;
  uint64 dirs_new = 6;
  uint64 dirs_changed = 7;
  uint64 dirs_unmodified = 8;
  uint64 total_dirs_processed = 9;
  uint64 total_dirsize_processed = 10;
  uint64 data_blobs = 11;
  uint64 tree_blobs = 12;
  uint64 data_added = 13;
  uint64 data_added_packed = 14;
  uint64 data_added_files = 15;
  uint64 data_added_files_packed = 16;
  uint64 data_added_trees = 17;
  uint64 data_added_trees_packed = 18;
  google.protobuf.Timestamp backup_start = 19;
  google.protobuf.Timestamp backup_end = 20;
}

message VfsNode {
  string name = 1;
  bool is_dir = 2;
  uint64 bytes = 3;
  google.protobuf.Timestamp ctime = 4;
  google.protobuf.Timestamp mtime = 5;
  google.protobuf.Timestamp atime = 6;
}

message Snapshot {
  string id = 1;
  google.protobuf.Timestamp time = 2;
  optional Summary summary = 3;
  repeated string tags = 4;
  repeated string paths = 5;
  string app_version = 6;
  // True when the snapshot carries rustic's delete protection (DeleteOption::Never).
  // Locked snapshots are never removed by retention (time- or space-based);
  // Forget refuses them unless ForgetArgs.include_locked is set.
  bool locked = 7;
}

// Retention rules for one repository. A zero value means "rule not used".
//
// Time-based rules use rustic's keep-* semantics and are applied per group of
// snapshots (same host + label + paths, so every backed-up data point is its own
// series). Space-based rules keep a part of the repository quota free by
// deleting the OLDEST unlocked snapshots first (FIFO) and pruning; the newest
// snapshot of every group and all locked snapshots are never touched by them.
message RetentionPolicy {
  uint32 keep_last = 1;
  uint32 keep_hourly = 2;
  uint32 keep_daily = 3;
  uint32 keep_weekly = 4;
  uint32 keep_monthly = 5;
  uint32 keep_yearly = 6;
  // Keep every snapshot younger than this many days (relative to the newest one).
  uint32 keep_within_days = 7;
  // Keep at least this many bytes of the repository quota free (0 = off).
  uint64 reserve_bytes = 8;
  // Keep at least this percentage of the repository quota free (0 = off, max 50).
  // When both reserve fields are set the larger requirement wins.
  uint32 reserve_percent = 9;
}

// Example: backup "/points/local/test/abcd" (a VFS path under one of the
// user's mounted data points) to the repo point named "repo_name".
message BackupArgs {
  FilePath src = 1;
  string repo_user = 2;
  string repo_id = 3;
  bool dry_run = 4;
  optional DataFilter filter = 5;
  repeated string tags = 6;
  // When set (and not a dry run), the job first makes room (space rules only),
  // takes the backup, then applies the full policy. Retention problems are
  // reported as job messages and never fail an otherwise successful backup.
  RetentionPolicy retention = 7;
}

// Example: restore "/" from repo point "repo_name", snapshot "xyz", to VFS
// path "/points/local/test/abcdefg" (a mounted data point).
message RestoreArgs {
  string repo_user = 1;
  string repo_id = 2;
  string snapshot_id = 3;
  string snapshot_path = 4;
  FilePath dest = 5;
  bool delete = 6;
  bool dry_run = 7;
}

message CheckArgs {
  string user = 1;
  string repo_id = 2;
}

message ForgetArgs {
  string user = 1;
  string repo_id = 2;
  repeated string snapshots = 3;
  // Locked snapshots are refused unless this is set.
  bool include_locked = 4;
}

// Applies a retention policy to a repository as a job (time rules, then FIFO
// space rules, then prune). With dry_run nothing is changed; the job messages
// list what would be deleted.
message RetentionArgs {
  string user = 1;
  string repo_id = 2;
  RetentionPolicy policy = 3;
  bool dry_run = 4;
}

// Locks (delete-protects) or unlocks one snapshot.
// A snapshot file cannot be edited in place, so the backend writes a modified
// copy and removes the original: the snapshot gets a NEW id (see response).
message SetSnapshotLockArgs {
  string user = 1;
  string repo_id = 2;
  string snapshot_id = 3;
  bool locked = 4;
}

message SetSnapshotLockResponse {
  // Id of the snapshot after the change (equal to previous_snapshot_id when it
  // was already in the requested state).
  string snapshot_id = 1;
  string previous_snapshot_id = 2;
  bool locked = 3;
}

message CancelArgs {
  string job_id = 1;
}

message GetSnapshotArgs {
  string user = 1;
  string repo_id = 2;
}

message ListSnapshotArgs {
  string user = 1;
  string repo_id = 2;
  string snapshot_id = 3;
  string snapshot_path = 4;
}

message ReadSnapshotArgs {
  string user = 1;
  string repo_id = 2;
  string snapshot_id = 3;
  string snapshot_path = 4;
  uint64 offset = 5;
  uint64 length = 6;
}


enum SnapshotEntryKind {
  SNAPSHOT_ENTRY_KIND_FILE = 0;
  SNAPSHOT_ENTRY_KIND_DIRECTORY = 1;
  SNAPSHOT_ENTRY_KIND_SYMLINK = 2;
  // Devices, sockets, fifos.
  SNAPSHOT_ENTRY_KIND_OTHER = 3;
}

// One file, directory or link inside a snapshot.
message SnapshotEntry {
  string name = 1;
  // Absolute path inside the snapshot ("/" = snapshot root, "/" separators).
  // Exactly the value RestoreArgs.snapshot_path and BrowseSnapshotArgs.path expect.
  string path = 2;
  SnapshotEntryKind kind = 3;
  uint64 size = 4;
  google.protobuf.Timestamp mtime = 5;
  optional uint32 mode = 6;
  string user = 7;
  string group = 8;
  // Set for symlinks.
  string link_target = 9;
}

///////////////////////////////////////////////////////////////////

message JobFinishedEvent {
  string job_id = 1;
  bool success = 2;
  optional string snapshot = 3;
  google.protobuf.Timestamp time = 4;
  // Set when success == false.
  optional string error = 5;
}

message JobNewMessageEvent {
  string job_id = 1;
  Priority priority = 2;
  string message = 3;
  google.protobuf.Timestamp time = 4;
}

message JobBarLengthSet {
  string job_id = 1;
  string bar_id = 2;
  uint64 length = 3;
  google.protobuf.Timestamp time = 4;
}

message JobBarTitleSet {
  string job_id = 1;
  string bar_id = 2;
  string title = 3;
  google.protobuf.Timestamp time = 4;
}

message JobBarIncrement {
  string job_id = 1;
  string bar_id = 2;
  uint64 increment = 3;
  google.protobuf.Timestamp time = 4;
}

message JobBarFinished {
  string job_id = 1;
  string bar_id = 2;
  google.protobuf.Timestamp time = 3;
}

message LogEvent {
  Priority priority = 1;
  string message = 2;
  google.protobuf.Timestamp time = 3;
}

// Emitted whenever a point's health changes while (re)building a user's VFS
// or initializing a repository.
message PointStatusEvent {
  string user = 1;
  string point_id = 2;
  string point_name = 3;
  PointHealth health = 4;
  string error = 5;
  google.protobuf.Timestamp time = 6;
}

message IpcEvent {
  oneof data {
    LogEvent logEvent = 1;
    JobFinishedEvent jobFinished = 2;
    JobNewMessageEvent jobMessage = 3;
    JobBarLengthSet jobStepLengthSet = 4;
    JobBarTitleSet jobStepTitleSet = 5;
    JobBarIncrement jobStepIncrement = 6;
    JobBarFinished jobStepFinished = 7;
    PointStatusEvent pointStatus = 8;
  }
}

///////////////////////////////////////////////////////////////////

message PollResponse {
  repeated IpcEvent events = 1;
}

message JobStartResponse {
  string job_id = 1;
}

message ListSnapshotResponse {
  repeated Snapshot output = 1;
}

message JobCancelResponse {
  string job_id = 1;
}

///////////////////////////////////////////////////////////////////

// Replaces the whole configuration. Write-protected remote points and repos
// are enforced server-side. See RepoSource.password for password changes.
message SetVfsArgs {
  repeated VfsUser users = 1;
}

message ListVfsResponse {
  repeated VfsNode nodes = 1;
}

message ReadVfsArgs {
  FilePath path = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message ReadVfsResponse {
  bytes data = 1;
}

// Opens a write handle on `path`. Only local/fs-backed, writable data points
// support this; any other target (remote backend, repo, read-only point) fails
// with PERMISSION_DENIED. Writes via Vfs_WriteAt are random-access.
message OpenWriteArgs {
  FilePath path = 1;
  bool overwrite = 2;
  bool append = 3;
}

message OpenWriteResponse {
  // Opaque handle id (a UUID) to pass to Vfs_WriteAt / Vfs_CloseWrite.
  string handle_id = 1;
}

// Writes `data` at byte offset `offset` into the file behind `handle_id`,
// as returned by Vfs_OpenWrite. Writing past the current end of the file
// extends it (the gap is zero-filled). Writes may be issued in any order.
message WriteAtArgs {
  string handle_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

// Flushes and closes a handle opened by Vfs_OpenWrite. The handle id is no
// longer valid after this call. Closing is required for the write to be
// durable;
// closing a handle twice, or one that's already expired/unknown, returns
// NOT_FOUND.
message CloseHandleArgs {
  string handle_id = 1;
}

// Copies or moves a file/dir. The destination must be a writable local data
// point. The source may be any data point or repo (copy), but a move needs a
// writable local source since it deletes it.
message TransferArgs {
  FilePath old_path = 1;
  FilePath new_path = 2;
  bool copy = 3;
}

message StatResponse {
  VfsNode node = 1;
}

message ExistsResponse {
  bool exists = 1;
}

message InfoResponse {
  repeated VfsInfo info = 1;
}


// Drops the cached VFS for `user` and rebuilds it (retrying failed points).
message ReloadArgs {
  string user = 1;
}

message SetLengthArgs {
  FilePath path = 1;
  uint64 length = 2;
  string handle_id = 3;
}

message GetJobArgs {
  string job_id = 1;
}

enum JobState {
  JOB_STATE_RUNNING = 0;
  JOB_STATE_SUCCEEDED = 1;
  JOB_STATE_FAILED = 2;
}

message JobStatusResponse {
  JobState state = 1;
  uint64 done_bytes = 2;
  uint64 total_bytes = 3;
  string error = 4;
}


message Empty {}

service IpcService {
  rpc Backup(BackupArgs) returns (JobStartResponse);
  rpc Restore(RestoreArgs) returns (JobStartResponse);
  rpc Check(CheckArgs) returns (JobStartResponse);
  rpc Forget(ForgetArgs) returns (JobStartResponse);
  rpc ApplyRetention(RetentionArgs) returns (JobStartResponse);
  rpc SetSnapshotLock(SetSnapshotLockArgs) returns (SetSnapshotLockResponse);

  rpc Snap_GetAll(GetSnapshotArgs) returns (ListSnapshotResponse);
  rpc Snap_ListDir(ListSnapshotArgs) returns (ListVfsResponse);
  rpc Snap_ReadFile(ReadSnapshotArgs) returns (ReadVfsResponse);

  rpc CancelJob(CancelArgs) returns (JobCancelResponse);
  rpc Poll(Empty) returns (PollResponse);
  rpc SetVfs(SetVfsArgs) returns (Empty);
  rpc GetVfs(Empty) returns (InfoResponse);
  rpc GetJob(GetJobArgs) returns (JobStatusResponse);
  rpc ReloadVfs(ReloadArgs) returns (InfoResponse); // returns that user's points w/ fresh health

  rpc Vfs_ReadFile(ReadVfsArgs) returns (ReadVfsResponse);
  rpc Vfs_TouchFile(FilePath) returns (Empty);

  // Write handles for both random-access (local) and streaming (remote).
  // Typical sequence: Vfs_OpenWrite once, Vfs_WriteAt any
  // number of times, then Vfs_CloseWrite once.
  rpc Vfs_OpenWrite(OpenWriteArgs) returns (OpenWriteResponse);
  rpc Vfs_WriteAt(WriteAtArgs) returns (Empty);
  rpc Vfs_CloseWrite(CloseHandleArgs) returns (Empty);

  rpc Vfs_ListDir(FilePath) returns (ListVfsResponse);
  rpc Vfs_CreateDir(FilePath) returns (Empty);
  rpc Vfs_RemoveFile(FilePath) returns (Empty);
  rpc Vfs_RemoveDir(FilePath) returns (Empty);
  rpc Vfs_SetLength(SetLengthArgs) returns (Empty);

  rpc Vfs_Stat(FilePath) returns (StatResponse);
  rpc Vfs_Exists(FilePath) returns (ExistsResponse);

  rpc Vfs_Transfer(TransferArgs) returns (JobStartResponse);
}