[package]
name = "opendal-vfs"
version = "0.59.1"
edition.workspace = true
rust-version.workspace = true

[dependencies]
opendal-core = "0.59"
async-trait = "0.1.92"
tokio = {version = "1", features = ["sync"] }
log = "0.4.34"
futures-lite = "2.6.1"
tempfile = "3.27.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
opendal = {version = "0.59", features = ["services-fs"]}